[project]
name = "production-agentic-rag"
version = "0.1.0"
description = "Production ready Agentic RAG system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "notebook>=7.5.6",
    "pdfplumber>=0.11.9",
    "sentence-transformers>=5.5.1",
]
