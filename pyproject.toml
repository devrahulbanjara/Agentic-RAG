[project]
name = "production-agentic-rag"
version = "0.1.0"
description = "Production ready Agentic RAG system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "docling>=2.95.0",
    "fastapi[standard]>=0.141.1",
    "flagembedding>=1.4.0",
    "google-genai>=2.6.0",
    "grobid-client-python>=0.1.4",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "mypy>=2.3.0",
    "notebook>=7.5.6",
    "pdfplumber>=0.11.9",
    "pre-commit>=4.6.0",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "ruff>=0.15.22",
    "sentence-transformers>=5.5.1",
    "types-pyyaml>=6.0.12.20260518",
    "types-requests>=2.32.4",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
