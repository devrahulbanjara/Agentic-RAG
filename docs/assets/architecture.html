<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Production Grade RAG Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #f5f5f2;
    color: #111827;
    overflow-x: auto;
    min-width: 2160px;
  }
  .subtitle {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #6b7280;
    font-weight: 500;
    letter-spacing: 0.04em;
    z-index: 20;
  }
  .canvas {
    position: relative;
    width: 2160px;
    padding: 60px 48px;
    margin: 0 auto;
  }
  .group {
    position: absolute;
    background: rgba(255,255,255,0.7);
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 16px 18px 18px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .group.dashed { border-style: dashed; }
  .group__header {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .group__header svg { width: 17px; height: 17px; }
  .group__badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: none;
    background: #ccfbf1;
    color: #0d9488;
    padding: 3px 7px;
    border-radius: 4px;
    margin-left: auto;
  }
  .grid { display: grid; gap: 10px; }
  .grid--2 { grid-template-columns: repeat(2, 1fr); }
  .grid--3 { grid-template-columns: repeat(3, 1fr); }
  .grid--4 { grid-template-columns: repeat(4, 1fr); }
  .card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    height: 88px;
    padding: 10px 6px 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 6px;
  }
  .card svg { width: 26px; height: 26px; color: #111827; }
  .card__label {
    font-size: 11px;
    font-weight: 500;
    color: #374151;
    line-height: 1.2;
  }
  .card__sub {
    font-size: 9px;
    font-weight: 500;
    color: #9ca3af;
    line-height: 1.1;
  }
  .sub-section {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #0d9488;
    margin: 0 0 8px 0;
    padding: 0;
  }
  .eval-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    align-items: start;
  }
  .eval-col { min-width: 0; }
  .bubble {
    position: absolute;
    border-radius: 999px;
    padding: 9px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    background: #ffffff;
    z-index: 6;
  }
  .bubble svg { width: 20px; height: 20px; }
  .bubble__label { font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
  .bubble--user { background: #059669; border: 1.5px solid #047857; color: #ffffff; }
  .bubble--user svg { color: #ffffff; }
  .bubble--resp { background: #2563eb; border: 1.5px solid #1d4ed8; color: #ffffff; }
  .bubble--resp svg { color: #ffffff; }
  .stage-zone {
    position: absolute;
    border-radius: 14px;
    z-index: 0;
    pointer-events: none;
  }
  .stage-zone--indexing {
    background: rgba(124, 58, 237, 0.07);
    border: 1.5px dashed rgba(124, 58, 237, 0.4);
  }
  .stage-zone--inference {
    background: rgba(217, 119, 6, 0.07);
    border: 1.5px dashed rgba(217, 119, 6, 0.4);
  }
  .stage-label {
    position: absolute;
    z-index: 4;
    line-height: 1.4;
  }
  .stage-label__eyebrow {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin: 0;
  }
  .stage-label__sub {
    font-size: 12px;
    font-weight: 400;
    color: #6b7280;
    margin: 0;
  }
  .stage-label--indexing .stage-label__eyebrow { color: #7c3aed; }
  .stage-label--inference .stage-label__eyebrow { color: #d97706; }
  svg.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .connector-label {
    font-size: 10.5px;
    font-style: italic;
    fill: #475569;
    font-weight: 500;
  }
</style>
</head>

<div class="subtitle">Production Grade RAG Architecture</div>
<div class="canvas" id="canvas">

    <div class="stage-label__eyebrow">Stage 1 — Indexing</div>
    <div class="stage-label__sub">Offline · runs once per corpus</div>
  </div>
  <div class="stage-label stage-label--inference" id="label-inference">
    <div class="stage-label__eyebrow">Stage 2 — Inference</div>
    <div class="stage-label__sub">Runtime · per user query</div>
  </div>
  <svg class="overlay" id="overlay" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />

        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />

      {label:'Info Evasion', icon:'key'}
    ]}
];

/* Evaluation is a special tall panel (constructed separately) */
const evalGroup = {
  id:'g11', title:'Evaluation', badge:'Ragas / DeepEval', color:'#0d9488', icon:'bar',
  pos:{x:560,y:1065,w:1500},
  sections:[
    { title:'Eval Dataset · 150-300 queries', cols:3, children:[
      {label:'Factual Queries', icon:'target'},
      {label:'Conceptual Queries', icon:'lightbulb'},
      {label:'Comparative Queries', icon:'scale'},
      {label:'Adversarial Queries', icon:'crosshair'}
    ]},
    { title:'Metrics', cols:3, children:[
      {label:'Recall@k MRR nDCG', icon:'bar'},
      {label:'Faithfulness', icon:'shield'},
      {label:'Citation Accuracy', icon:'bookmark'},
      {label:'Refusal Rate', icon:'hand'},
      {label:'Latency P50/P95', icon:'clock'},
      {label:'Cost $/1k queries', icon:'coin'}
    ]},
    { title:'Ablations', cols:3, children:[
      {label:'Dense vs Hybrid', icon:'ab'},
      {label:'Hyp. Q on/off', icon:'toggle'},
      {label:'Query Routing on/off', icon:'toggle'},
      {label:'MMR λ sweep', icon:'slider'},
      {label:'Chunk size sweep', icon:'resize'}
    ]}
  ]
};

/* ---------------- LAYOUT CONSTANTS ---------------- */
const GUTTER = 80;          // horizontal space between groups in a row
const STANDOFF = 8;         // gap between arrow tip and group edge
const LABEL_OFFSET = 14;    // vertical offset of label above arrow

function estimateGroupHeight(g) {
  const rows = Math.ceil(g.children.length / g.cols);
  return 38 + rows * 88 + (rows - 1) * 10 + 34;
}

function applyRowLayout(groupIds, startX, centerY) {
  const rowGroups = groupIds.map(id => groups.find(gr => gr.id === id)).filter(Boolean);
  const maxH = Math.max(...rowGroups.map(estimateGroupHeight));
  let x = startX;
  rowGroups.forEach(g => {
    g.pos.x = x;
    g.pos.y = centerY - maxH / 2;
    g.pos.minH = maxH;
    x += g.pos.w + GUTTER;
  });
}

// Normalize positions before rendering: equalize gutters + align row centers
applyRowLayout(['g1','g2','g3','g4','g5','g6'], 80, 270);
applyRowLayout(['g7','g8','g9','g10'],          360, 800);

/* ---------------- RENDER GROUPS ---------------- */
function hexToRgba(hex, a) {
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function renderCard(c) {
  return `<div class="card">${svgIcon(c.icon)}<div class="card__label">${c.label}</div>${c.sub?`<div class="card__sub">${c.sub}</div>`:''}</div>`;
}

function renderGroup(g) {
  const el = document.createElement('div');
  el.className = 'group' + (g.dashed ? ' dashed' : '');
  el.setAttribute('data-group', g.id);
  el.style.left = g.pos.x + 'px';
  el.style.top = g.pos.y + 'px';
  el.style.width = g.pos.w + 'px';
  el.style.borderColor = hexToRgba(g.color, 0.30);
  el.style.background = hexToRgba(g.color, 0.06);
  let cardsHtml = '';
  if (g.sections) {
    // Horizontal multi-section layout (used by Evaluation)
    const cols = g.sections.map(s =>
      `<div class="eval-col">
         <div class="sub-section">${s.title}</div>
         <div class="grid grid--${s.cols}">${s.children.map(renderCard).join('')}</div>
       </div>`
    ).join('');
    cardsHtml = `<div class="eval-row">${cols}</div>`;
  } else {
    cardsHtml = `<div class="grid grid--${g.cols}">${g.children.map(renderCard).join('')}</div>`;
  }
  const badge = g.badge ? `<span class="group__badge">${g.badge}</span>` : '';
  el.innerHTML = `<div class="group__header" style="color:${g.color}">${svgIcon(g.icon)}<span>${g.title}</span>${badge}</div>${cardsHtml}`;
  if (g.pos.h) el.style.minHeight = g.pos.h + 'px';
  if (g.pos.minH) el.style.minHeight = g.pos.minH + 'px';
  return el;
}

const canvas = document.getElementById('canvas');
[...groups, evalGroup].forEach(g => canvas.appendChild(renderGroup(g)));

/* ---------------- BUBBLES ---------------- */
function renderBubble(cls, x, y, label, icon){
  const el = document.createElement('div');
  el.className = `bubble ${cls}`;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.setAttribute('data-group', label.toLowerCase().replace(/\s+/g,'-'));
  el.innerHTML = `${svgIcon(icon)}<span class="bubble__label">${label}</span>`;
  return el;
}
// Place bubbles aligned with inference row center (y=800), bubble height ~40
canvas.appendChild(renderBubble('bubble--user', 130, 780, 'User Query', 'person'));
canvas.appendChild(renderBubble('bubble--resp', 1820, 780, 'Response', 'chat'));

/* ---------------- CANVAS HEIGHT ---------------- */
function setCanvasHeight() {
  const els = canvas.querySelectorAll('.group, .bubble');
  let maxBottom = 0;
  els.forEach(el=>{
    const r = el.getBoundingClientRect();
    const cR = canvas.getBoundingClientRect();
    const b = r.bottom - cR.top;
    if (b > maxBottom) maxBottom = b;
  });
  canvas.style.height = (maxBottom + 80) + 'px';
  const overlay = document.getElementById('overlay');
  overlay.setAttribute('width', canvas.offsetWidth);
  overlay.setAttribute('height', canvas.offsetHeight);
}

/* ---------------- CONNECTORS ---------------- */
function bbox(selector) {
  const el = canvas.querySelector(selector);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  const c = canvas.getBoundingClientRect();
  return {
    left:   r.left - c.left,
    top:    r.top - c.top,
    right:  r.right - c.left,
    bottom: r.bottom - c.top,
    width:  r.width,
    height: r.height,
    cx:     r.left - c.left + r.width/2,
    cy:     r.top - c.top + r.height/2
  };
}

function makePath(d, opts) {
  const ns = 'http://www.w3.org/2000/svg';
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', d);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', opts.stroke || '#374151');
  p.setAttribute('stroke-width', opts.width || 1.75);
  if (opts.dash) p.setAttribute('stroke-dasharray', '6,4');
  p.setAttribute('marker-end', `url(#${opts.marker || 'arrow-dark'})`);
  return p;
}

const pendingLabels = [];
function addLabel(x, y, text, color) {
  pendingLabels.push({ x, y, text, color: color || '#475569' });
}

function renderLabels() {
  const ns = 'http://www.w3.org/2000/svg';
  const overlay = document.getElementById('overlay');
  pendingLabels.forEach(({x, y, text, color}) => {
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'middle');
    t.setAttribute('class', 'connector-label');
    if (color) t.style.fill = color;
    t.textContent = text;
    overlay.appendChild(t);
  });
}

function hLine(a, b, opts, label) {
  // Anchor at right-center of source, left-center of target, with standoff
  const x1 = a.right + STANDOFF;
  const x2 = b.left - STANDOFF;
  const overlay = document.getElementById('overlay');

  if (Math.abs(a.cy - b.cy) < 2) {
    const y = a.cy;
    const d = `M ${x1} ${y} L ${x2} ${y}`;
    overlay.appendChild(makePath(d, opts));
    if (label) {
      // Label sits ABOVE group top (in zone padding) — no overlap with cards
      const labelY = Math.min(a.top, b.top) - 12;
      addLabel((x1 + x2) / 2, labelY, label, opts.labelColor);
    }
  } else {
    const xm = (x1 + x2) / 2;
    const d = `M ${x1} ${a.cy} L ${xm} ${a.cy} L ${xm} ${b.cy} L ${x2} ${b.cy}`;
    overlay.appendChild(makePath(d, opts));
    if (label) {
      const useTop = Math.abs(xm - x1) > Math.abs(x2 - xm);
      const lx = useTop ? (x1 + xm) / 2 : (xm + x2) / 2;
      const ly = Math.min(a.top, b.top) - 12;
      addLabel(lx, ly, label, opts.labelColor);
    }
  }
}

function customPath(points, opts, label, labelIdx) {
  const d = points.map((p,i)=> (i===0?'M':'L')+' '+p[0]+' '+p[1]).join(' ');
  const overlay = document.getElementById('overlay');
  overlay.appendChild(makePath(d, opts));
  if (label) {
    const i = labelIdx ?? Math.floor(points.length / 2);
    const a = points[i-1], b = points[i];
    const lx = (a[0]+b[0])/2;
    const ly = (a[1]+b[1])/2;
    addLabel(lx, ly, label, opts.labelColor);
  }
}

function drawConnectors() {
  const G = id => bbox(`[data-group="${id}"]`);
  const dark = { stroke:'#6b7280', marker:'arrow-dark' };

  // Indexing row — straight horizontal lines (centers aligned)
  hLine(G('g1'), G('g2'), dark, '500-2000 PDFs');
  hLine(G('g2'), G('g3'), dark, 'structured JSON');
  hLine(G('g3'), G('g4'), dark, 'typed elements');
  hLine(G('g4'), G('g5'), dark, 'per chunk');
  hLine(G('g5'), G('g6'), dark, 'embed + store');

  // Inference row — straight horizontal lines (centers aligned)
  const uq = G('user-query');
  const resp = G('response');
  hLine(uq, G('g7'), dark, 'natural language');
  hLine(G('g7'), G('g8'), dark, 'routed query');
  hLine(G('g8'), G('g9'), dark, 'top 8 chunks');
  hLine(G('g9'), G('g10'), dark, 'grounded context');
  hLine(G('g10'), resp, dark);

  // Storage → Hybrid Retrieval — vertical drop, label on vertical segment near source
  const g6 = G('g6'), g8 = G('g8');
  const startX = g6.cx;
  const startY = g6.bottom + STANDOFF;
  const endX = g8.cx;
  const endY = g8.top - STANDOFF;
  const midY = (startY + endY) / 2;
  customPath(
    [[startX, startY], [startX, midY], [endX, midY], [endX, endY]],
    dark
  );
  // Label placed near vertical segment, close to Storage (source)
  addLabel(startX + 54, startY + 28, 'vector + BM25');

}

/* ---------------- STAGE ZONES + BANNERS ---------------- */
function positionStageZones() {
  // Indexing zone bounds = union of g1..g6 group boxes
  const idxIds = ['g1','g2','g3','g4','g5','g6'];
  const infIds = ['user-query','g7','g8','g9','g10','response'];

  function unionBBox(ids) {
    let l=Infinity, t=Infinity, r=-Infinity, b=-Infinity;
    ids.forEach(id => {
      const el = canvas.querySelector(`[data-group="${id}"]`);
      if (!el) return;
      const cr = canvas.getBoundingClientRect();
      const er = el.getBoundingClientRect();
      l = Math.min(l, er.left - cr.left);
      t = Math.min(t, er.top - cr.top);
      r = Math.max(r, er.right - cr.left);
      b = Math.max(b, er.bottom - cr.top);
    });
    return {l,t,r,b};
  }

  const pad = 22;
  const headerOffset = 52;
  const idx = unionBBox(idxIds);
  const inf = unionBBox(infIds);

  const zIdx = document.getElementById('zone-indexing');
  zIdx.style.left = (idx.l - pad) + 'px';
  zIdx.style.top  = (idx.t - pad - headerOffset) + 'px';
  zIdx.style.width = (idx.r - idx.l + pad*2) + 'px';
  zIdx.style.height = (idx.b - idx.t + pad*2 + headerOffset) + 'px';

  const zInf = document.getElementById('zone-inference');
  zInf.style.left = (inf.l - pad) + 'px';
  zInf.style.top  = (inf.t - pad - headerOffset) + 'px';
  zInf.style.width = (inf.r - inf.l + pad*2) + 'px';
  zInf.style.height = (inf.b - inf.t + pad*2 + headerOffset) + 'px';

  // Plain typography labels, flush top-left of each zone
  const lIdx = document.getElementById('label-indexing');
  lIdx.style.left = (idx.l - pad + 4) + 'px';
  lIdx.style.top  = (idx.t - pad - headerOffset + 4) + 'px';

  const lInf = document.getElementById('label-inference');
  lInf.style.left = (inf.l - pad + 4) + 'px';
  lInf.style.top  = (inf.t - pad - headerOffset + 4) + 'px';
}

/* ---------------- INIT ---------------- */
window.addEventListener('load', () => {
  setCanvasHeight();
  positionStageZones();
  drawConnectors();
  renderLabels();
  setCanvasHeight();
});
</script>
